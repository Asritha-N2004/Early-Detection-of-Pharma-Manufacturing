name: Verify prototype
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pharma_test
          POSTGRES_USER: pharma
          POSTGRES_PASSWORD: test-only-ci-password
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U pharma -d pharma_test" --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg://pharma:test-only-ci-password@localhost:5432/pharma_test
      DATABASE_URL: postgresql+psycopg://pharma:test-only-ci-password@localhost:5432/pharma_test
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.lock
      - run: alembic upgrade head
      - run: python -m pytest backend/tests -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile --ignore-scripts && pnpm run build
        working-directory: frontend
